version: "3.9"
services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    command: streamlit run apps/streamlit_dashboard.py --server.port=8501 --server.address=0.0.0.0
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn apps.api_service:app --host 0.0.0.0 --port 8000 --reload
